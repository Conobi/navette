# Single-worker plaintext bench config. No keepalive_timeout reduction,
# no access_log, no gzip — minimal hot path for fair comparison.
worker_processes 1;
worker_rlimit_nofile 1048576;
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}
http {
    access_log off;
    error_log /dev/stderr warn;
    keepalive_timeout 65;
    keepalive_requests 1000000;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    server {
        listen 8080 reuseport backlog=8192;
        location = /plaintext {
            default_type text/plain;
            return 200 "Hello, World!";
        }
    }
}
