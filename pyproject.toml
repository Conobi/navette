[project]
name = "navette"
version = "0.1.0"
description = "Pure-Mojo networking stack: QUIC, HTTP/3, HTTP/2, HTTP/1.1"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "boucle",
    "json-simd-mojo",
    "mojox>=0.2",
    "mojo-compiler==0.26.2.0",
]

[dependency-groups]
dev = [
    "aioquic>=1.3.0",
    "cryptography>=44.0",
    "h11>=0.16.0",
    "h2>=4.3.0",
    "hpack>=4.1.0",
    "httptools>=0.7.1",
    "hyperframe>=6.0.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = [
    "mojox-build>=0.2.3",
    "mojo-compiler==0.26.2.0",
    # Mojo deps must be available at BUILD time (mojox-build calls `mojo package`,
    # which resolves cross-package imports). PEP 517 build envs are isolated from
    # the project's runtime deps, so boucle and json-simd-mojo are pinned here too.
    "boucle @ git+ssh://git@github.com/Conobi/boucle.git@fc7a2f516abaee0c6afb1b2de921e84e9c51826a",
    "json-simd-mojo @ git+ssh://git@github.com/Conobi/json-simd-mojo.git@e034f5ed6c97fc615c240e15c3c50f84a03dc54d",
]
build-backend = "mojox_build"

[tool.mojox-build]
packages = ["navette"]
# mojox-build>=0.2.1 auto-injects -I<site-packages>/mojo_packages so
# uv-installed deps (boucle, json-simd-mojo) resolve without manual flags.

# Build the Rust TLS shim (librustls-mojo) before compiling the Mojo package,
# then bundle the resulting .so into the wheel as a native lib. Consumers
# need cargo + rustc on PATH at build time; runtime users just need uv.
#
# Default `release` profile exports the `*_insecure` Cargo symbol so CLI
# tools (fetch -k) work like curl out of the box. Insecure cert verification
# remains opt-in at the API level — production code must not call the
# `*_new_insecure` wrappers; that's the safety contract.
#
# Production server deployments that want defense-in-depth (a .so that
# *cannot* invoke the insecure verifier even if code accidentally references
# it) opt in to the hardened profile:
#   default ship: scripts/build_rustls.sh release  → includes insecure symbol
#   hardened:     MOJOX_BUILD_PROFILE=hardened     → strips insecure symbol
# Build both native shims before mojox-build packages: librustls_mojo.so
# (TLS) and libcompress_mojo.so (gzip/brotli, system zlib+brotli). The
# compress shim has no security-mode profile knob — its safety contract
# is "stays inside DecoderLimits"; see spec 2026-05-17-compress-shim-split.
pre-build = [
    'scripts/build_rustls.sh "${MOJOX_BUILD_PROFILE:-release}"',
    'scripts/build_compress.sh release',
]
native-libs = [
    "lib/librustls_mojo.so",
    "lib/libcompress_mojo.so",
]

[tool.uv.sources]
boucle         = { git = "ssh://git@github.com/Conobi/boucle.git",         rev = "fc7a2f516abaee0c6afb1b2de921e84e9c51826a" }
json-simd-mojo = { git = "ssh://git@github.com/Conobi/json-simd-mojo.git", rev = "e034f5ed6c97fc615c240e15c3c50f84a03dc54d" }
