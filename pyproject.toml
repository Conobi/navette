[project]
name = "navette"
version = "0.1.0"
description = "Pure-Mojo networking stack: QUIC, HTTP/3, HTTP/2, HTTP/1.1"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "boucle",
    "mojox>=0.2",
    "mojo-compiler==1.0.0b1",
]

[dependency-groups]
dev = [
    "aioquic>=1.3.0",
    "cryptography>=44.0",
    "h11>=0.16.0",
    "h2>=4.3.0",
    "hpack>=4.1.0",
    "httptools>=0.7.1",
    "hyperframe>=6.0.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = [
    "mojox-build>=0.2.3",
    "mojo-compiler==1.0.0b1",
    "mojo-compiler-mojo-libs==1.0.0b1",
    # Mojo deps must be available at BUILD time (mojox-build calls `mojo package`,
    # which resolves cross-package imports). PEP 517 build envs are isolated from
    # the project's runtime deps, so boucle is pinned here too.
    "boucle @ git+ssh://git@github.com/Conobi/boucle.git@956f1003ef68d50b1f65f7ad263a5374c5c9bbd2",
]
build-backend = "mojox_build"

[tool.mojox-build]
packages = ["navette"]
# mojox-build>=0.2.1 auto-injects -I<site-packages>/mojo_packages so
# uv-installed deps (boucle) resolve without manual flags.

# Sdist hygiene. mojox-build's default walker prunes a fixed top-level set
# (dist, build, .venv, …) but does NOT honour .gitignore, so anything the
# project keeps local-only and out of git still leaks into the sdist tar.
# Patterns use Python `fnmatch`, where `*` is greedy across `/` — so a
# single pattern covers a subtree at any depth.
#
# Buckets:
#   * Rust build artefacts (`target/` per crate; multi-GB)
#   * Native .so/.dylib outputs (`lib/`; rebuilt by pre-build hook)
#   * Bench evidence (perf.data, JSONs, symfs/, flamegraphs; regenerable,
#     can be 100s of MB each)
#   * Internal working files (`specs/`, `plans/`, `research/`, local docs)
#   * Generated test certs and downloaded vectors
#   * Built example binaries
source-exclude = [
    # Rust build artefacts
    "*/target/*",
    # Prebuilt native shims (sdist consumers rebuild via pre-build hooks)
    "lib/*",
    # Bench evidence
    "bench/profile/*",
    "bench/quic_perf/results/*",
    "bench/quic_perf/logs/*",
    "bench/.httparena/*",
    "bench/h1_server",
    "bench/h2_server",
    "bench/h3_server",
    "bench/launcher",
    # Internal working files (gitignored, kept local-only)
    "specs/*",
    "plans/*",
    "research/*",
    "docs/project-context.md",
    "docs/superpowers/*",
    "docs/plans/*",
    # Generated test material
    "conformance/vectors/hpack-stories/*",
    "certs/*",
    "examples/*/certs/*",
    "examples/*/main",
    "examples/*/dist/*",
    # Misc
    "*/__pycache__/*",
    "CLAUDE.md",
]
# Keep README + LICENSE + the navette package itself + pyproject — those
# fall under the default include (the walker), filtered only by this list.

# Build the Rust TLS shim (librustls-mojo) before compiling the Mojo package,
# then bundle the resulting .so into the wheel as a native lib. Consumers
# need cargo + rustc on PATH at build time; runtime users just need uv.
#
# Default `release` profile exports the `*_insecure` Cargo symbol so CLI
# tools (fetch -k) work like curl out of the box. Insecure cert verification
# remains opt-in at the API level — production code must not call the
# `*_new_insecure` wrappers; that's the safety contract.
#
# Production server deployments that want defense-in-depth (a .so that
# *cannot* invoke the insecure verifier even if code accidentally references
# it) opt in to the hardened profile:
#   default ship: scripts/build_rustls.sh release  → includes insecure symbol
#   hardened:     MOJOX_BUILD_PROFILE=hardened     → strips insecure symbol
# Build both native shims before mojox-build packages: librustls_mojo.so
# (TLS) and libcompress_mojo.so (gzip/brotli, system zlib+brotli). The
# compress shim has no security-mode profile knob — its safety contract
# is "stays inside DecoderLimits"; see spec 2026-05-17-compress-shim-split.
pre-build = [
    'scripts/build_rustls.sh "${MOJOX_BUILD_PROFILE:-release}"',
    'scripts/build_compress.sh release',
]
native-libs = [
    "lib/librustls_mojo.so",
    "lib/libcompress_mojo.so",
]

[tool.uv]
# 1.0.0b1 is a pre-release; allow uv to pick it up by default for this project.
prerelease = "allow"

[tool.uv.sources]
boucle = { git = "ssh://git@github.com/Conobi/boucle.git", rev = "956f1003ef68d50b1f65f7ad263a5374c5c9bbd2" }
