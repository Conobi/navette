[project]
name = "mojo-net"
version = "0.1.0"
description = "Pure-Mojo networking stack: QUIC, HTTP/3, HTTP/2, HTTP/1.1"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "hpack>=4.1.0",
]

[dependency-groups]
dev = [
    "mojox",
    "cryptography>=44.0",
    "aioquic>=1.3.0",
    "h11>=0.16.0",
    "httptools>=0.7.1",
    "hyperframe>=6.0.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false
