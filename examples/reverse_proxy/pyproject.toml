[project]
name = "navette-example-reverse-proxy"
version = "0.0.0"
description = "reverse_proxy — unified ALPN-dispatched H1+H2 reverse proxy using navette"
requires-python = ">=3.11"
dependencies = [
    "navette",
    "boucle",
    "mojox>=0.2",
    "mojo-compiler==1.0.0b1",
]

[build-system]
requires = [
    "mojox-build>=0.3.0",
    "mojo-compiler==1.0.0b1",
    "mojo-compiler-mojo-libs==1.0.0b1",
    "navette",
    "boucle",
]
build-backend = "mojox_build"

[tool.mojox-build]
packages = []
binaries = [
    { source = "main.mojo", name = "reverse_proxy" },
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
mojox-build = { git = "ssh://git@github.com/Conobi/mojox.git", rev = "d6b1f07e99453f3d04c94cdbd925eaef9aa34d03", subdirectory = "packages/mojox-build" }
navette     = { path = "../..", editable = true }
boucle      = { git = "ssh://git@github.com/Conobi/boucle.git", rev = "27f8b3e666de32d78458fd839377183624461e5e" }
