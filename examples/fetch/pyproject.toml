[project]
name = "navette-example-fetch"
version = "0.0.0"
description = "fetch — HTTP client example using navette"
requires-python = ">=3.11"
dependencies = [
    "navette",
    "boucle",
    "mojox>=0.3",
    "mojo-compiler==1.0.0b2",
]

[build-system]
requires = [
    "mojox-build>=0.4",
    "mojo-compiler==1.0.0b2",
    "mojo-compiler-mojo-libs==1.0.0b2",
    # mojo build of main.mojo needs cross-package imports resolved at build
    # time; PEP 517 build envs are isolated from runtime deps, so navette
    # and its Mojo deps are pinned here too.
    "navette",
    "boucle",
]
build-backend = "mojox_build"

[tool.mojox-build]
packages = []
binaries = [
    { source = "main.mojo", name = "fetch" },
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
navette     = { path = "../..", editable = true }
boucle      = { git = "ssh://git@github.com/Conobi/boucle.git", rev = "cd91272af9e3a3c5038563d8fb0f6965365ac42a" }
