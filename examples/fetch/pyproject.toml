[project]
name = "navette-example-fetch"
version = "0.0.0"
description = "fetch — HTTP client example using navette"
requires-python = ">=3.11"
dependencies = [
    "navette",
    "bouclette",
    "mojox>=0.5",
    "mojo-compiler==1.0.0",
]

[dependency-groups]
# Developer toolchain: mojo-lsp-server, mojo-lldb, lldb-dap and the mblack
# formatter. Not the compiler -- mojo-compiler above provides that.
dev = [
    "mojo==1.0.0",
]

[build-system]
requires = [
    "mojox-build>=0.5",
    "mojox-core>=0.5",
    "mojo-compiler==1.0.0",
    "mojo-compiler-mojo-libs==1.0.0",
    # mojo build of main.mojo needs cross-package imports resolved at build
    # time; PEP 517 build envs are isolated from runtime deps, so navette
    # and its Mojo deps are pinned here too.
    "navette",
    "bouclette",
]
build-backend = "mojox_build"

[tool.mojox]
packages = []
binaries = [
    { source = "main.mojo", name = "fetch" },
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
navette     = { path = "../..", editable = true }
bouclette   = { git = "https://github.com/Conobi/bouclette", rev = "020957e" }
