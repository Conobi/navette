[project]
name = "navette-example-hello-h3-server"
version = "0.0.0"
description = "hello_h3_server — minimal HTTP/3-over-QUIC server using navette"
requires-python = ">=3.11"
dependencies = [
    "navette",
    "bouclette",
    "mojox>=0.5",
    "mojo-compiler==1.0.0",
]

[dependency-groups]
# Developer toolchain: mojo-lsp-server, mojo-lldb, lldb-dap and the mblack
# formatter. Not the compiler -- mojo-compiler above provides that.
dev = [
    "mojo==1.0.0",
]

[build-system]
requires = [
    "mojox-build>=0.5",
    "mojox-core>=0.5",
    "mojo-compiler==1.0.0",
    "mojo-compiler-mojo-libs==1.0.0",
    "navette",
    "bouclette",
]
build-backend = "mojox_build"

[tool.mojox]
packages = []
binaries = [
    { source = "main.mojo", name = "hello_h3_server" },
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
navette     = { path = "../..", editable = true }
bouclette   = { git = "https://github.com/Conobi/bouclette", rev = "020957e" }
