[project]
name = "navette-example-hello-h3-server"
version = "0.0.0"
description = "hello_h3_server — minimal HTTP/3-over-QUIC server using navette"
requires-python = ">=3.11"
dependencies = [
    "navette",
    "boucle",
    "mojox>=0.3",
    "mojo-compiler==1.0.0b2",
]

[build-system]
requires = [
    "mojox-build>=0.4",
    "mojo-compiler==1.0.0b2",
    "mojo-compiler-mojo-libs==1.0.0b2",
    "navette",
    "boucle",
]
build-backend = "mojox_build"

[tool.mojox-build]
packages = []
binaries = [
    { source = "main.mojo", name = "hello_h3_server" },
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
navette     = { path = "../..", editable = true }
boucle      = { git = "ssh://git@github.com/Conobi/boucle.git", rev = "cd91272af9e3a3c5038563d8fb0f6965365ac42a" }
