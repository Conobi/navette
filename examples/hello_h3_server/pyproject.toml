[project]
name = "navette-example-hello-h3-server"
version = "0.0.0"
description = "hello_h3_server — minimal HTTP/3-over-QUIC server using navette"
requires-python = ">=3.11"
dependencies = [
    "navette",
    "boucle",
    "mojox>=0.2",
    "mojo-compiler==1.0.0b1",
]

[build-system]
requires = [
    "mojox-build>=0.3.0",
    "mojo-compiler==1.0.0b1",
    "mojo-compiler-mojo-libs==1.0.0b1",
    "navette",
    "boucle",
]
build-backend = "mojox_build"

[tool.mojox-build]
packages = []
binaries = [
    { source = "main.mojo", name = "hello_h3_server" },
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
mojox-build = { path = "/home/donokami/Projets/perso/mojox/packages/mojox-build", editable = true }
navette     = { path = "../..", editable = true }
boucle      = { git = "ssh://git@github.com/Conobi/boucle.git", rev = "956f1003ef68d50b1f65f7ad263a5374c5c9bbd2" }
