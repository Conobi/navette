[project]
name = "navette-example-hello-h1-server"
version = "0.0.0"
description = "hello_h1_server — minimal HTTP/1.1 plaintext server using navette"
requires-python = ">=3.11"
dependencies = [
    "navette",
    "boucle",
    "mojox>=0.2",
    "mojo-compiler==1.0.0b1",
]

[build-system]
requires = [
    "mojox-build>=0.3.0",
    "mojo-compiler==1.0.0b1",
    "mojo-compiler-mojo-libs==1.0.0b1",
    "navette",
    "boucle",
]
build-backend = "mojox_build"

[tool.mojox-build]
packages = []
binaries = [
    { source = "main.mojo", name = "hello_h1_server" },
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
mojox-build = { path = "/home/donokami/Projets/perso/mojox/packages/mojox-build", editable = true }
navette     = { path = "../..", editable = true }
boucle      = { git = "ssh://git@github.com/Conobi/boucle.git", rev = "d0f8717c50a5aa40e6c513477fe02fee295dc76b" }
