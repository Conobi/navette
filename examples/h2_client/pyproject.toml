[project]
name = "mojo-net-example-h2-client"
version = "0.0.0"
description = "h2_client — HTTP/2 client example using mojo-net"
requires-python = ">=3.11"
dependencies = [
    "mojo-net",
    "boucle",
    "json-simd-mojo",
    "mojox>=0.2",
    "mojo-compiler==0.26.2.0",
]

[tool.uv.sources]
mojo-net       = { path = "../.." }
boucle         = { git = "ssh://git@github.com/Conobi/boucle.git",         rev = "fc7a2f516abaee0c6afb1b2de921e84e9c51826a" }
json-simd-mojo = { git = "ssh://git@github.com/Conobi/json-simd-mojo.git", rev = "e034f5ed6c97fc615c240e15c3c50f84a03dc54d" }

[tool.uv]
package = false
