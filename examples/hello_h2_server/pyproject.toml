[project]
name = "mojo-net-example-hello-h2-server"
version = "0.0.0"
description = "hello_h2_server — minimal HTTP/2-over-TLS server using mojo-net"
requires-python = ">=3.11"
dependencies = [
    "mojo-net",
    "boucle",
    "json-simd-mojo",
    "mojox>=0.2",
    "mojo-compiler==0.26.2.0",
]

[build-system]
requires = [
    "mojox-build>=0.3.0",
    "mojo-compiler==0.26.2.0",
    "mojo-net",
    "boucle",
    "json-simd-mojo",
]
build-backend = "mojox_build"

[tool.mojox-build]
packages = []
binaries = [
    { source = "main.mojo", name = "hello_h2_server" },
]

[tool.uv.sources]
mojox-build    = { path = "/home/donokami/Projets/perso/mojox/packages/mojox-build", editable = true }
mojo-net       = { path = "../..", editable = true }
boucle         = { git = "ssh://git@github.com/Conobi/boucle.git",         rev = "fc7a2f516abaee0c6afb1b2de921e84e9c51826a" }
json-simd-mojo = { git = "ssh://git@github.com/Conobi/json-simd-mojo.git", rev = "e034f5ed6c97fc615c240e15c3c50f84a03dc54d" }
