[project]
name = "navette-example-hello-h2-server"
version = "0.0.0"
description = "hello_h2_server — minimal HTTP/2-over-TLS server using navette"
requires-python = ">=3.11"
dependencies = [
    "navette",
    "boucle",
    "mojox>=0.5",
    "mojo-compiler==1.0.0",
]

[dependency-groups]
# Developer toolchain: mojo-lsp-server, mojo-lldb, lldb-dap and the mblack
# formatter. Not the compiler -- mojo-compiler above provides that.
dev = [
    "mojo==1.0.0",
]

[build-system]
requires = [
    "mojox-build>=0.5",
    "mojox-core>=0.5",
    "mojo-compiler==1.0.0",
    "mojo-compiler-mojo-libs==1.0.0",
    "navette",
    "boucle",
]
build-backend = "mojox_build"

[tool.mojox]
packages = []
binaries = [
    { source = "main.mojo", name = "hello_h2_server" },
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
navette     = { path = "../..", editable = true }
boucle      = { git = "https://github.com/Conobi/boucle", rev = "4195dc7a640608551803d5bb423b248a7963d73d" }
