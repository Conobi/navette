[package]
name = "quiche-raw-frame-scenarios"
version = "0.1.0"
edition = "2021"
publish = false
description = "Raw-frame QUIC conformance scenarios for navette."

[dependencies]
quiche = { path = "../vendor/quiche-raw-frame", default-features = false, features = ["boringssl-vendored"] }
serde_json = "1"
ring = "0.17"

[lib]
name = "quiche_raw_frame_scenarios"
path = "src/lib.rs"

[[bin]]
name = "sanity_get"
path = "src/bin/sanity_get.rs"

[[bin]]
name = "s_f01_stream_large_offset"
path = "src/bin/s_f01_stream_large_offset.rs"

[[bin]]
name = "s_f10_unknown_frame"
path = "src/bin/s_f10_unknown_frame.rs"

[[bin]]
name = "s_f11_no_frames"
path = "src/bin/s_f11_no_frames.rs"

[[bin]]
name = "s_f12_reserved_bits_hs"
path = "src/bin/s_f12_reserved_bits_hs.rs"

[[bin]]
name = "s_f13_path_challenge_hs"
path = "src/bin/s_f13_path_challenge_hs.rs"
