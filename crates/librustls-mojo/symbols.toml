# librustls-mojo FFI symbol schema (§2.3 - 2026-05-13)
#
# Single source of truth for the rlsm_* symbols that cross the
# Rust <-> Mojo boundary. The `#[no_mangle] extern "C" fn` declarations
# live across crates/librustls-mojo/src/{tcp,decode,config,handles,
# quic_hs,quic,error,lib}.rs and are mirrored by hand-written
# `OwnedDLHandle.call[...]` blocks in src/tls/{lib,config,connection}.mojo
# and src/http/decode.mojo.
#
# scripts/gen_rlsm_bindings.py consumes this file to emit
# src/tls/_rlsm_bindings.mojo. Drift between Rust source and this file
# is asserted by scripts/check_integrations.sh (§2.3).
#
# Type mapping conventions:
#   Rust i32                       <-> Mojo Int32
#   Rust i64                       <-> Mojo Int64
#   Rust u8                        <-> Mojo UInt8
#   Rust u32                       <-> Mojo UInt32
#   Rust u64                       <-> Mojo UInt64
#   Rust usize                     <-> Mojo Int
#   Rust *const u8 / *mut u8       <-> Mojo UnsafePointer[UInt8]
#   Rust *const i32 / *mut i32     <-> Mojo UnsafePointer[Int32]
#   Rust *const u64 / *mut u64     <-> Mojo UnsafePointer[UInt64]
#   Rust *const *mut u8            <-> Mojo UnsafePointer[UnsafePointer[UInt8]]
#   Rust *mut <opaque struct>      <-> Mojo UnsafePointer[NoneType]

schema_version = 1

# ----------------------------------------------------------------------------
# lib.rs - microbench stub
# ----------------------------------------------------------------------------

[[symbol]]
name = "rlsm_noop"
description = "Test stub - returns 0."
rust_args = []
rust_ret  = "i32"
mojo_args = []
mojo_ret  = "Int32"

