[package]
name = "librustls-mojo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aws-lc-rs = "1"
rustls = "0.23"
rustls-pemfile = "2"
webpki-roots = "1"
# flate2 + brotli moved to crates/libcompress-mojo per spec
# 2026-05-17-compress-shim-split.md. librustls-mojo ships TLS only.

[dev-dependencies]
hex = "0.4"
rcgen = "0.12"

[features]
default = []
skip-locks = []
insecure = []
test-instrumentation = []

[profile.release]
panic = "abort"
# DWARF unwind info for perf-record flamegraphs (spec
# 2026-05-04-shortconn-perf-flamegraph-spec.md §5). `line-tables-only`
# adds DWARF line-number + frame info without full type info — enough
# for perf --call-graph=dwarf to resolve rustls/aws-lc-rs frames; binary
# grows ~30-50% but `strip = false` (default) keeps `.dynsym` intact.
debug = "line-tables-only"
strip = false

# Cargo profile for wheels distributed via PyPI. Inherits from release,
# then strips symbols + enables LTO + single codegen unit. Drops .so size
# ~50% and adds optimisation opportunities the per-CGU pipeline misses.
# Named `dist` rather than `publish` because Cargo reserves the latter.
# Used by scripts/build_rustls.sh dist; the CI workflow passes
# MOJOX_BUILD_PROFILE=dist so user-installed wheels are slim while
# local dev/bench keeps debug info for flamegraphs.
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
